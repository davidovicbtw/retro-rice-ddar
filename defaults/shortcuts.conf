# DDAR keyboard shortcuts -> generated into ~/.config/hypr/ddar/shortcuts.conf
#
# Format:    MODS+KEY = command
#            MODS+KEY = @dispatcher args      (a raw Hyprland dispatcher)
# Modifiers: SUPER ALT CTRL SHIFT (also MOD2 MOD3 MOD5 CAPS)
# Keys:      Hyprland key names: A-Z, 0-9, Return, Space, Print, F1..F12, code:NN
#
# Examples:
#   SUPER+SHIFT+B = firefox
#   SUPER+Print   = grim -g "$(slurp)" - | wl-copy
#   SUPER+ALT+3   = @workspace 3
#
# Manage from the terminal:
#   ddar shortcut list
#   ddar shortcut add SUPER+SHIFT+B firefox
#   ddar shortcut remove SUPER+SHIFT+B
#   ddar shortcut edit
#
# The defaults below use SUPER+ALT so they are unlikely to clash with your
# existing binds. `ddar shortcut check` reports conflicts.

SUPER+ALT+D = ddar launcher
SUPER+ALT+M = ddar menu
SUPER+ALT+T = ddar tui
SUPER+ALT+W = ddar wallpaper next
SUPER+ALT+R = ddar run
