# DDAR user configuration
# Change values here or with: ddar config  /  ddar config set KEY VALUE
# Then apply with: ddar run
# This file is parsed (not executed). Unknown or invalid values are ignored
# with a warning and the default is used instead.

# Colour theme (see: ddar theme list)
THEME="retro"

# Wallpaper colours: off, accent only, or full palette
#   options: off,accent,full
MATUGEN="accent"

# Accent colour override (#rrggbb or auto)
ACCENT="auto"

# Directory scanned for wallpapers
WALLPAPER_DIR="~/Pictures/Wallpapers"

# Current wallpaper (set by: ddar wallpaper)
WALLPAPER=""

# Program used to draw the wallpaper
#   options: auto,awww,swww,swaybg,hyprpaper,none
WALLPAPER_BACKEND="auto"

# UI font family
FONT="Noto Sans"

# UI font size (pt)
#   range: 8-16
FONT_SIZE="10"

# Monospace font (terminal, popups)
MONO_FONT="monospace"

# Bar height (px)
#   range: 22-40
BAR_HEIGHT="26"

# Bar modules, left
#   modules: ddar workspaces taskbar window media cpu memory network volume battery backlight tray clock weather
BAR_LEFT="ddar workspaces"

# Bar modules, centre
#   modules: ddar workspaces taskbar window media cpu memory network volume battery backlight tray clock weather
BAR_CENTER="taskbar"

# Bar modules, right
#   modules: ddar workspaces taskbar window media cpu memory network volume battery backlight tray clock weather
BAR_RIGHT="media cpu memory network volume battery tray clock"

# Enabled widgets
#   modules: ddar workspaces taskbar window media cpu memory network volume battery backlight tray clock weather
WIDGETS="ddar workspaces taskbar media cpu memory network volume battery tray clock"

# Workspace button style
#   options: numbers,boxes,roman
WORKSPACE_STYLE="numbers"

# Clock format (strftime)
CLOCK_FORMAT="%a %H:%M"

# Bar/launcher transparency (percent)
#   range: 0-60
TRANSPARENCY="0"

# Hyprland animation intensity
#   options: off,low,normal
ANIMATIONS="low"

# Let DDAR set Hyprland borders/gaps/rounding/animations
#   options: on,off
HYPR_STYLE="on"

# Rofi launcher layout
#   options: list,grid,compact,spotlight
LAUNCHER_STYLE="list"

# Show application icons in the launcher
#   options: on,off
LAUNCHER_ICONS="on"

# Terminal used for TUI popups (auto = detect)
TERMINAL="auto"

# Start mako if no notification daemon is running
#   options: auto,mako,off
NOTIFICATIONS="auto"

# Weather location for the weather widget (empty = by IP)
WEATHER_LOCATION=""

# Start DDAR from Hyprland (exec-once)
#   options: on,off
AUTOSTART="on"

