name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
      - name: Smoke tests (sandboxed HOME, includes shellcheck)
        run: tests/smoke.sh
