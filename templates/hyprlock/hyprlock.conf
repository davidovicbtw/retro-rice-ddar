# DDAR lock screen for hyprlock - generated by DDAR @@version@@, do not edit.
# Opened by: ddar lock   (theme: @@theme_name@@)
# A retro "Computer Locked" dialog over the wallpaper.

background {
    monitor =
    path = @@lock_bg@@
    color = rgb(@@desktop_rgb@@)
    blur_passes = 0
}

# dialog body: outer dark frame
shape {
    monitor =
    size = 452, 222
    color = rgb(@@frame_rgb@@)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}
# dialog face with the light inner bevel
shape {
    monitor =
    size = 450, 220
    color = rgb(@@face_rgb@@)
    rounding = 0
    border_size = 1
    border_color = rgb(@@face_hi_rgb@@)
    position = 0, 0
    halign = center
    valign = center
}
# title bar
shape {
    monitor =
    size = 444, 24
    color = rgb(@@title_a_rgb@@)
    rounding = 0
    position = 0, 93
    halign = center
    valign = center
}
label {
    monitor =
    text = <b>DDAR  -  Computer Locked</b>
    color = rgb(@@accent_text_rgb@@)
    font_size = 11
    font_family = @@font@@
    position = 0, 93
    halign = center
    valign = center
}

label {
    monitor =
    text = This computer is in use and has been locked.
    color = rgb(@@text_rgb@@)
    font_size = 11
    font_family = @@font@@
    position = 0, 52
    halign = center
    valign = center
}
label {
    monitor =
    text = Only <b>$USER</b> can unlock this computer.
    color = rgb(@@text_rgb@@)
    font_size = 11
    font_family = @@font@@
    position = 0, 30
    halign = center
    valign = center
}

# sunken password field
input-field {
    monitor =
    size = 300, 30
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(@@face_lo_rgb@@)
    inner_color = rgb(@@field_rgb@@)
    font_color = rgb(@@field_text_rgb@@)
    check_color = rgb(@@accent_rgb@@)
    fail_color = rgb(@@urgent_rgb@@)
    fail_text = <i>$FAIL</i>
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    rounding = 0
    position = 0, -16
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y   %H:%M:%S"
    color = rgb(@@text_dim_rgb@@)
    font_size = 9
    font_family = @@font@@
    position = 0, -72
    halign = center
    valign = center
}
