# Generated by DDAR - HYPR_STYLE=on. Set HYPR_STYLE="off" in
# ~/.config/ddar/ddar.conf to keep your own look settings instead.
general {
    border_size = 2
    gaps_in = 3
    gaps_out = 6
    col.active_border = $ddar_accent $ddar_accent2 90deg
    col.inactive_border = $ddar_shadow
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 3
        render_power = 4
        offset = 3 3
        color = rgba(00000066)
    }
}
