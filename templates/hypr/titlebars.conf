# DDAR window title bars (hyprbars plugin) - generated, do not edit.
# Enabled with: ddar titlebars on   Needs: hyprpm enable hyprbars
# Buttons are listed right-to-left: close, maximise, minimise.
# "Minimise" moves the window to the special workspace "minimized";
# bring it back with: ddar minimized   (or the DDAR menu)

exec-once = hyprpm reload -n

plugin {
    hyprbars {
        bar_height = 22
        bar_color = rgb(@@title_a_rgb@@)
        col.text = rgb(@@accent_text_rgb@@)
        bar_text_font = @@font@@ Bold
        bar_text_size = @@font_size@@
        bar_text_align = left
        bar_buttons_alignment = right
        bar_part_of_window = true
        bar_precedence_over_border = true

        # hyprbars-button = background, size, icon, command, icon colour
        hyprbars-button = rgb(@@urgent_rgb@@), 16, ✕, hyprctl dispatch killactive, rgb(ffffff)
        hyprbars-button = rgb(@@face_rgb@@), 16, □, hyprctl dispatch fullscreen 1, rgb(@@text_rgb@@)
        hyprbars-button = rgb(@@face_rgb@@), 16, _, hyprctl dispatch movetoworkspacesilent special:minimized, rgb(@@text_rgb@@)

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
